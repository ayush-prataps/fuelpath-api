[pytest]
# Tell pytest-django which settings module to use
DJANGO_SETTINGS_MODULE = config.settings.test

# Discover all test_*.py files under tests/
testpaths = tests

# Friendly output — show local variables on failure, short traceback
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=apps
    --cov-report=term-missing
    --cov-report=html:htmlcov

# Register custom marks to avoid PytestUnknownMarkWarning
markers =
    unit: Pure-Python unit tests (no DB, no HTTP).
    integration: Tests that touch the DB or make HTTP calls.
    slow: Tests that are deliberately slow (e.g., large data).
